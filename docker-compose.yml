version: '3.8'

services:
  # PHP/Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kerajinantangan_app_admin
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/public/build
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    networks:
      - kerajinantangan_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: kerajinantangan_nginx_admin
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl-setup.sh:/usr/local/bin/ssl-setup.sh
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - kerajinantangan_network
    environment:
      - DOMAIN=${DOMAIN:-your-domain.com}
      - EMAIL=${EMAIL:-your-email@example.com}

volumes:
  certbot_certs:
  certbot_www:

networks:
  kerajinantangan_network:
    driver: bridge